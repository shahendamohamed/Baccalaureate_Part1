<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار تطور تكنولوجيا المعلومات والتحول الاجتماعي - الدرس الأول ICT</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.15);
            padding: 25px;
            width: 100%;
            max-width: 650px;
            position: relative;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        h2 {
            color: var(--secondary);
            text-align: center;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
            min-height: 55px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #334155;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 14px;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: var(--secondary);
        }

        .option-btn.correct {
            background-color: var(--success) !important;
            box-shadow: 0 0 12px var(--success);
            font-weight: bold;
            color: #ffffff;
        }

        .option-btn.wrong {
            background-color: var(--danger) !important;
            box-shadow: 0 0 12px var(--danger);
        }

        .stars-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }

        @keyframes popStars {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }

            50% {
                transform: translate(-50%, -70%) scale(1.4);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -90%) scale(1);
                opacity: 0;
            }
        }

        .animate-stars {
            animation: popStars 0.8s ease-out forwards;
        }

        .footer-info {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 14px;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .score-big {
            font-size: 48px;
            color: var(--secondary);
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>

<body>

    <div class="quiz-card">
        <div id="stars" class="stars-overlay">✨🌟✨</div>

        <div id="quiz-box">
            <h2>🏆 تطور تكنولوجيا المعلومات والتحول الاجتماعي </h2>
            <div class="question-text" id="q-text">جاري تحميل السؤال...</div>
            <div class="options-list" id="options-container"></div>
            <div class="footer-info">
                <span>السؤال: <span id="q-current">1</span> / 5</span>
                <span>النقاط: <span id="score-live">0</span></span>
            </div>
        </div>

        <div id="result-box" class="result-screen">
            <h2>🎉 تم إنهاء التحدي ! 🎉</h2>
            <p>درجتك النهائية هي:</p>
            <div class="score-big"><span id="score-final">0</span> / 5</div>
            <p id="feedback-msg" style="color: #94a3b8; margin-bottom: 20px; white-space: pre-line;"></p>
            <button class="option-btn" style="text-align:center; width:100%;" onclick="restartQuiz()">تحدي جديد بأسئلة
                مختلفة 🔄</button>
        </div>
    </div>

    <script>
        // بنك الأسئلة الشامل (15 سؤال)
        const allQuestionsPool = [
            {
                q: "ما المقصود بقانون مور؟",
                options: ["تضاعف عدد الترانزستورات تقريبًا كل عامين", "ظهور الإنترنت التجاري", "زيادة عدد مستخدمي الهواتف يوميًا"],
                correct: 0
            },
            {
                q: "أي ترتيب للمراحل التالية صحيح تاريخياً؟",
                options: ["الهواتف الذكية ← الإنترنت التجاري ← الحواسيب الشخصية", "الحواسيب الشخصية ← الإنترنت التجاري ← الهواتف الذكية", "الحوسبة السحابية ← الحواسيب الإلكترونية ← الإنترنت"],
                correct: 1
            },
            {
                q: "أي تقنية تضيف معلومات رقمية إلى مشهد من العالم الحقيقي؟",
                options: ["الواقع الافتراضي VR", "الواقع المعزز AR", "الحوسبة الكمومية"],
                correct: 1
            },
            {
                q: "شراء المنتجات والخدمات عبر الإنترنت يسمى:",
                options: ["التجارة الإلكترونية", "العمل عن بُعد", "الدفع غير النقدي"],
                correct: 0
            },
            {
                q: "لماذا تستخدم السيارة ذاتية القيادة الحوسبة الطرفية؟",
                options: ["لزيادة وقت انتظار الاستجابة", "لتقليل زمن الاستجابة عند معالجة بعض البيانات في نفس اللحظة", "للاستغناء عن كل المستشعرات"],
                correct: 1
            },
            {
                q: "ما هي الميزة الأساسية التي تقدمها الحوسبة السحابية؟",
                options: ["زيادة حجم المعالجات الفيزيائية داخل الأجهزة", "تخزين البيانات ومعالجتها على خوادم عن بُعد عبر الإنترنت", "الاستغناء التام عن كابلات الإنترنت الأرضية"],
                correct: 1
            },
            {
                q: "شبكة من الأجهزة الفيزيائية المتصلة بالإنترنت لتبادل البيانات فيما بينها تُعبر عن مفهوم:",
                options: ["الحوسبة الكمومية", "إنترنت الأشياء (IoT)", "الواقع الافتراضي (VR)"],
                correct: 1
            },
            {
                q: "ما هو الهدف الرئيسي من استخدام التشفير في الشبكات؟",
                options: ["تسريع سرعة تحميل صفحات الويب", "حماية خصوصية وأمن البيانات ومنع الأطراف غير المصرح لها من قراءتها", "تقليل تكلفة شراء الهواتف الذكية"],
                correct: 1
            },
            {
                q: "تتميز الحوسبة الكمومية بقدرتها الفائقة على معالجة البيانات بفضل استخدامها لـ:",
                options: ["الكيوبيتس (Qubits) بدلاً من البتات التقليدية", "كابلات ألياف ضوئية تحت البحر", "شاشات عرض ذات دقة فائقة"],
                correct: 0
            },
            {
                q: "أي مما يلي يُعد مثالاً مباشراً على العمل عن بُعد؟",
                options: ["الذهاب يومياً للمقر الرئيسي للشركة", "أداء المهام الوظيفية والتواصل مع الفريق عبر برامج الاجتماعات الافتراضية من المنزل", "الشراء من المتاجر الإلكترونية وتوصيل السلع"],
                correct: 1
            },
            {
                q: "تقنية تحاكي بيئة حقيقية أو خيالية بالكامل وتفصل المستخدم تماماً عن واقعه عبر نظارة مغلقة:",
                options: ["الواقع المعزز (AR)", "الواقع الافتراضي (VR)", "التجارة الإلكترونية"],
                correct: 1
            },
            {
                q: "دفع الفواتير ومصاريف المدارس عبر تطبيقات الموبايل يُسمى:",
                options: ["الحوسبة الطرفية", "الدفع الإلكتروني / غير النقدي", "قانون مور لتطوير الشبكات"],
                correct: 1
            },
            {
                q: "يقوم مفهوم تعلم الآلة (Machine Learning) كأحد فروع الذكاء الاصطناعي على:",
                options: ["كتابة الإنسان لكل خطوة وقرار يتخذه الكمبيوتر يدوياً", "قدرة النظام البرمجي على تحليل البيانات والتعلم منها لاستنتاج القرارات تلقائياً", "تصنيع الأجزاء الصلبة للحواسب في المصانع"],
                correct: 1
            },
            {
                q: "لماذا تُفضل المصانع الذكية استخدام الحوسبة الطرفية (Edge Computing)؟",
                options: ["للحصول على مساحات تخزين غير محدودة للصور القديمة", "لاتخاذ قرارات فورية وحاسمة للآلات في أجزاء من الثانية دون انتظار السيرفرات البعيدة", "لأنها لا تتطلب وجود شبكة محليّة على الإطلاق"],
                correct: 1
            },
            {
                q: "ظهر مصطلح الإنترنت التجاري كخطوة فارقة لأنه سمح بـ:",
                options: ["استخدام الإنترنت فقط داخل المؤسسات العسكرية والجامعات المغلقة", "فتح المجال للشركات العامة والأفراد العاديين لاستخدام الويب وشراء الخدمات والسلع", "اختراع أول حاسوب إلكتروني ضخم في العالم"],
                correct: 1
            }
        ];

        let activeQuestions = [];
        let currentIdx = 0;
        let currentScore = 0;

        const qText = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options-container');
        const qCurrent = document.getElementById('q-current');
        const scoreLive = document.getElementById('score-live');
        const stars = document.getElementById('stars');
        const quizBox = document.getElementById('quiz-box');
        const resultBox = document.getElementById('result-box');
        const scoreFinal = document.getElementById('score-final');
        const feedbackMsg = document.getElementById('feedback-msg');

        // دالة لاختيار 5 أسئلة عشوائية فريدة من نوعها في كل دورة
        function prepareRandomQuestions() {
            // خلط مصفوفة الأسئلة الأصلية بشكل عشوائي كامل
            const shuffled = [...allQuestionsPool].sort(() => 0.5 - Math.random());
            // قطع أول 5 أسئلة فقط للاختبار الحالي
            activeQuestions = shuffled.slice(0, 5);
        }

        function renderQuestion() {
            const item = activeQuestions[currentIdx];
            qText.innerText = `${currentIdx + 1}. ${item.q}`;
            qCurrent.innerText = currentIdx + 1;
            scoreLive.innerText = currentScore;
            optionsContainer.innerHTML = '';

            item.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = opt;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }
        function selectOption(selectedIndex, btnElement) {
            const correctIndex = activeQuestions[currentIdx].correct;
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);
            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                currentScore++;
                scoreLive.innerText = currentScore;
                stars.classList.add('animate-stars');
                setTimeout(() => stars.classList.remove('animate-stars'), 800);
            } else {
                btnElement.classList.add('wrong');
                allBtns[correctIndex].classList.add('correct');
            }
            setTimeout(() => {
                currentIdx++;
                if (currentIdx < activeQuestions.length) {
                    renderQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }
        function showResults() {
            quizBox.style.display = 'none';
            resultBox.style.display = 'block';
            scoreFinal.innerText = currentScore;
            if (currentScore === 5) {
                feedbackMsg.innerText = "👑 سكور ممتاز وعلامة كاملة! 👑\nلقد أتقنتِ الإجابة على جميع الأسئلة الموجهة لكِ، مستوى مبهر!";
            } else if (currentScore >= 3) {
                feedbackMsg.innerText = "🌟 نتيجة رائعة! 🌟\nمستواكِ مستقر وقوي جداً. جربي اللعب مرة أخرى لتجربة أسئلة جديدة وتثبيت الإتقان.";
            } else {
                feedbackMsg.innerText = "📚 فرصة ممتازة للمحاولة مجدداً 📚\nالأسئلة العشوائية تقيس دقة الفهم الشامل، اضغطي على زر التحدي الجديد لتجربة مجموعة أسئلة أخرى وتحسين درجاتكِ!";
            }
        }
        function restartQuiz() {
            currentIdx = 0;
            currentScore = 0;
            resultBox.style.display = 'none';
            quizBox.style.display = 'block';
            prepareRandomQuestions();
            renderQuestion();
        }
        // بدء تشغيل اللعبة وتوليد الأسئلة العشوائية فور التحميل لأول مرة
        window.onload = function () {
            prepareRandomQuestions();
            renderQuestion();
        };
    </script>
