<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كويز الذكاء الاصطناعي والتعلم الآلي - ICT</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.15);
            padding: 25px;
            width: 100%;
            max-width: 650px;
            position: relative;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        h2 {
            color: var(--secondary);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
            min-height: 55px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #334155;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 14px;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: var(--secondary);
        }

        .option-btn.correct {
            background-color: var(--success) !important;
            box-shadow: 0 0 12px var(--success);
            font-weight: bold;
            color: #ffffff;
        }

        .option-btn.wrong {
            background-color: var(--danger) !important;
            box-shadow: 0 0 12px var(--danger);
        }

        .stars-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }

        @keyframes popStars {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }

            50% {
                transform: translate(-50%, -70%) scale(1.4);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -90%) scale(1);
                opacity: 0;
            }
        }

        .animate-stars {
            animation: popStars 0.8s ease-out forwards;
        }

        .footer-info {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 14px;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .score-big {
            font-size: 48px;
            color: var(--secondary);
            font-weight: bold;
            margin: 15px 0;
        }

        .answers-review {
            text-align: right;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #334155;
            max-height: 300px;
            overflow-y: auto;
        }

        .review-item {
            margin-bottom: 15px;
            font-size: 14px;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            border-right: 4px solid var(--success);
        }
    </style>
</head>

<body>

    <div class="quiz-card">
        <div id="stars" class="stars-overlay">✨🌟✨</div>

        <div id="quiz-box">
            <h2>اختبر فهمك للذكاء الاصطناعي</h2>
            <div class="subtitle">خمسة أسئلة سريعة على الدرس. اختر إجابة لكل سؤال ثم اضغط عليها.</div>
            <div class="question-text" id="q-text">جاري تحميل السؤال...</div>
            <div class="options-list" id="options-container"></div>
            <div class="footer-info">
                <span>السؤال: <span id="q-current">1</span> / 5</span>
                <span>النقاط: <span id="score-live">0</span></span>
            </div>
        </div>

        <div id="result-box" class="result-screen">
            <h2>🎉 تم إنهاء الاختبار بنجاح! 🎉</h2>
            <p>درجتك النهائية هي:</p>
            <div class="score-big"><span id="score-final">0</span> / 5</div>
            <p id="feedback-msg" style="color: #94a3b8; margin-bottom: 20px; white-space: pre-line;"></p>
            <button class="option-btn" style="text-align:center; width:100%;" onclick="restartQuiz()">تحدي جديد بأسئلة
                أخرى 🔄</button>

        </div>
    </div>

    <script>
        // بنك الـ 15 سؤالاً الكامل مع تحديد الإجابات الصحيحة بدقة
        const questionsPool = [
            {
                q: "ما المصطلح الذي يصف الأنظمة الحاسوبية القادرة على التعلم والتعرف والتنبؤ وتوليد المحتوى؟",
                options: ["التعلم العميق", "الذكاء الاصطناعي", "الشبكات العصبية", "قواعد البيانات"],
                correct: 1
            },
            {
                q: "أيٌّ مما يلي يُعد فرعًا من الذكاء الاصطناعي؟",
                options: ["التعلم الآلي", "أنظمة التشغيل", "قواعد البيانات", "معالجة النصوص فقط"],
                correct: 0
            },
            {
                q: "يعتمد التعلم العميق على:",
                options: ["القواعد المكتوبة فقط", "تخزين الملفات", "الشبكات العصبية متعددة الطبقات", "الاتصال بالإنترنت فقط"],
                correct: 2
            },
            {
                q: "أيٌّ مما يلي يُعد مثالًا على الذكاء الاصطناعي التوليدي؟",
                options: ["مرشح الرسائل المزعجة", "نظام حفظ الملفات", "لوحة المفاتيح التقليدية", "أداة توليد الصور"],
                correct: 3
            },
            {
                q: "ما الوظيفة الأساسية للتعلم الآلي؟",
                options: ["تخزين البيانات دون تحليلها", "تعلم الأنماط من البيانات لإجراء تنبؤات أو تصنيفات", "تنفيذ قواعد ثابتة فقط", "زيادة سرعة الإنترنت"],
                correct: 1
            },
            {
                q: "التعلم الآلي بالنسبة إلى الذكاء الاصطناعي هو:",
                options: ["فرع منه", "مجال لا علاقة له به", "مرادف له تمامًا", "نوع من أنظمة التشغيل"],
                correct: 0
            },
            {
                q: "التعلم العميق هو:",
                options: ["برنامج لتخزين البيانات", "نوع من قواعد البيانات", "أسلوب من أساليب التعلم الآلي", "لغة برمجة"],
                correct: 2
            },
            {
                q: "أيٌّ مما يلي مثال على استخدام الذكاء الاصطناعي؟",
                options: ["التعرف على الكلام", "حفظ ملف يدويًا فقط", "تشغيل شاشة دون أي معالجة", "توصيل لوحة المفاتيح بالحاسوب"],
                correct: 0
            },
            {
                q: "الشبكة العصبية الاصطناعية مستوحاة بصورة مبسطة من:",
                options: ["شبكات الإنترنت", "ترابط العصبونات", "قواعد البيانات", "أجهزة الطباعة"],
                correct: 1
            },
            {
                q: "ماذا يحدث لأوزان الوحدات المترابطة في الشبكة العصبية أثناء التدريب؟",
                options: ["تظل ثابتة دائمًا", "تُحذف جميع البيانات", "تتحول إلى صور", "تتغير لتتعلم أنماطًا من البيانات"],
                correct: 3
            },
            {
                q: "ما المقصود بهلوسة الذكاء الاصطناعي؟",
                options: ["توقف الحاسوب عن العمل", "انقطاع الاتصال بالإنترنت", "إنتاج معلومات تبدو معقولة لكنها غير صحيحة", "عدم القدرة على حفظ الملفات"],
                correct: 2
            },
            {
                q: "لماذا يجب التحقق من مخرجات الذكاء الاصطناعي التوليدي؟",
                options: ["لأنها قد تحتوي على معلومات خاطئة أو غير مدعومة", "لأنها لا تستطيع إنشاء نصوص", "لأنها تعمل دون بيانات دائمًا", "لأنها لا تستخدم في التعليم"],
                correct: 0
            },
            {
                q: "أيٌّ مما يلي ليس مثالًا مناسبًا على الذكاء الاصطناعي التوليدي؟",
                options: ["ChatGPT", "أداة توليد الصور", "أداة توليد الصوت", "مرشح الرسائل المزعجة"],
                correct: 3
            },
            {
                q: "يريد مزارع تدريب نظام لتمييز المحاصيل السليمة من المصابة. ما الذي يحتاج إليه النظام؟",
                options: ["صورًا للمحاصيل دون معرفة حالتها", "صورًا مناسبة مع بيانات توضح حالة كل صورة", "صورًا للمحاصيل السليمة فقط دائمًا", "أسماء المزارعين فقط"],
                correct: 1
            },
            {
                q: "ما العامل الذي قد يجعل نظام تشخيص أمراض المحاصيل يخطئ في التنبؤ؟",
                options: ["تدريبه على صور مناسبة ومتنوعة", "وجود بيانات توضح حالة الصور", "قلة البيانات أو اختلاف الصور الجديدة عن أمثلة التدريب", "توفير أمثلة للمحاصيل المصابة والسليمة"],
                correct: 2
            }
        ];

        let currentQuestions = [];
        let currentIdx = 0;
        let currentScore = 0;

        const qText = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options-container');
        const qCurrent = document.getElementById('q-current');
        const scoreLive = document.getElementById('score-live');
        const stars = document.getElementById('stars');
        const quizBox = document.getElementById('quiz-box');
        const resultBox = document.getElementById('result-box');
        const scoreFinal = document.getElementById('score-final');
        const feedbackMsg = document.getElementById('feedback-msg');
        const reviewContainer = document.getElementById('review-container');

        function shuffleAndSelectQuestions() {
            const shuffled = [...questionsPool].sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, 5);
        }
        function renderQuestion() {
            const item = currentQuestions[currentIdx];
            qText.innerText = item.q;
            qCurrent.innerText = currentIdx + 1;
            scoreLive.innerText = currentScore;
            optionsContainer.innerHTML = '';
            item.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = opt;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }
        function selectOption(selectedIndex, btnElement) {
            const correctIndex = currentQuestions[currentIdx].correct;
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);
            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                currentScore++;
                scoreLive.innerText = currentScore;
                stars.classList.add('animate-stars');
                setTimeout(() => stars.classList.remove('animate-stars'), 800);
            } else {
                btnElement.classList.add('wrong');
                allBtns[correctIndex].classList.add('correct');
            }
            setTimeout(() => {
                currentIdx++;
                if (currentIdx < currentQuestions.length) {
                    renderQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }
        function showResults() {
            quizBox.style.display = 'none';
            resultBox.style.display = 'block';
            scoreFinal.innerText = currentScore;
            if (currentScore === 5) {
                feedbackMsg.innerText = "👑 سكور ممتاز وعلامة كاملة! 👑\nلقد أتقنتِ الإجابة على جميع الأسئلة العشوائية الموجهة لكِ، مستوى مبهر!";
            } else if (currentScore >= 3) {
                feedbackMsg.innerText = "🌟 نتيجة رائعة! 🌟\nمستواكِ مستقر وقوي جداً. جربي اللعب مرة أخرى لتجربة أسئلة عشوائية جديدة وتثبيت الإتقان.";
            } else {
                feedbackMsg.innerText = "📚 فرصة ممتازة للمحاولة مجدداً 📚\nالأسئلة العشوائية تقيس دقة الفهم الشامل، اضغطي على زر التحدي الجديد لتجربة مجموعة أسئلة أخرى وتحسين درجاتكِ!";
            }
        }
        function restartQuiz() {
            currentIdx = 0;
            currentScore = 0;
            resultBox.style.display = 'none';
            quizBox.style.display = 'block';
            shuffleAndSelectQuestions();
            renderQuestion();
        }
        window.onload = function () {
            shuffleAndSelectQuestions();
            renderQuestion();
        };

    </script>
