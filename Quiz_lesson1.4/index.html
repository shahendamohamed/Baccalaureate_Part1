<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درس 1.4 :القضايا الأخلاقية المتعلقة بالذكاء الاصطناعي</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.15);
            padding: 25px;
            width: 100%;
            max-width: 650px;
            position: relative;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        h2 {
            color: var(--secondary);
            text-align: center;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
            min-height: 55px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #334155;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 14px;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: var(--secondary);
        }

        .option-btn.correct {
            background-color: var(--success) !important;
            box-shadow: 0 0 12px var(--success);
            font-weight: bold;
            color: #ffffff;
        }

        .option-btn.wrong {
            background-color: var(--danger) !important;
            box-shadow: 0 0 12px var(--danger);
        }

        .stars-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }

        @keyframes popStars {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }

            50% {
                transform: translate(-50%, -70%) scale(1.4);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -90%) scale(1);
                opacity: 0;
            }
        }

        .animate-stars {
            animation: popStars 0.8s ease-out forwards;
        }

        .footer-info {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 14px;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .score-big {
            font-size: 48px;
            color: var(--secondary);
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>

<body>

    <div class="quiz-card">
        <div id="stars" class="stars-overlay">✨🌟✨</div>

        <div id="quiz-box">
            <h2> درس 1.4 </h2>
            <h2>🏆 القضايا الأخلاقية المتعلقة بالذكاء الاصطناعي </h2>
            <div class="question-text" id="q-text">جاري تحميل السؤال...</div>
            <div class="options-list" id="options-container"></div>
            <div class="footer-info">
                <span>السؤال: <span id="q-current">1</span> / 5</span>
                <span>النقاط: <span id="score-live">0</span></span>
            </div>
        </div>

        <div id="result-box" class="result-screen">
            <h2>🎉 تم إنهاء التحدي ! 🎉</h2>
            <p>درجتك النهائية هي:</p>
            <div class="score-big"><span id="score-final">0</span> / 5</div>
            <p id="feedback-msg" style="color: #94a3b8; margin-bottom: 20px; white-space: pre-line;"></p>
            <button class="option-btn" style="text-align:center; width:100%;" onclick="restartQuiz()">تحدي جديد بأسئلة
                مختلفة 🔄</button>
        </div>
    </div>

    <script>
        // بنك الأسئلة الشامل (15 سؤال)
        const allQuestionsPool = [
            {
                q: "ما المقصود بالتحيز الخوارزمي (Algorithmic Bias)؟",
                options: [
                    "قدرة الذكاء الاصطناعي على التعلم بسرعة",
                    "نمط في نتائج الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة",
                    "استخدام الإنترنت في تدريب الأنظمة",
                    "زيادة سرعة معالجة البيانات"
                ],
                correct: 1
            },
            {
                q: "ما أحد الأسباب الرئيسية لحدوث التحيز الخوارزمي؟",
                options: [
                    "استخدام شاشات حديثة",
                    "زيادة سرعة الإنترنت",
                    "وجود تحيز في بيانات التدريب",
                    "تحديث نظام التشغيل"
                ],
                correct: 2
            },
            {
                q: "ماذا يمكن أن يحدث إذا كانت بيانات تدريب الذكاء الاصطناعي متحيزة؟",
                options: [
                    "قد يكرر النظام هذا التحيز في قراراته",
                    "سيصبح النظام أكثر عدالة دائمًا",
                    "سيتوقف النظام عن العمل نهائيًا",
                    "ستختفي جميع الأخطاء"
                ],
                correct: 0
            },
            {
                q: "ما الهدف من مبدأ العدالة (Fairness)؟",
                options: [
                    "زيادة سرعة النظام",
                    "تخزين بيانات المستخدمين",
                    "إخفاء طريقة اتخاذ القرارات",
                    "عدم التمييز بشكل غير عادل ضد الأشخاص أو المجموعات"
                ],
                correct: 3
            },
            {
                q: "أي موقف يعبّر عن تطبيق مبدأ العدالة؟",
                options: [
                    "جمع بيانات الطلاب دون علمهم",
                    "التأكد من أن النظام يقيّم جميع الطلاب دون تمييز",
                    "إخفاء أسباب قرارات النظام",
                    "عدم مراجعة نتائج النظام"
                ],
                correct: 1
            },
            {
                q: "ما المقصود بمبدأ الشفافية (Transparency)؟",
                options: [
                    "توضيح كيفية عمل النظام وأسباب اتخاذه للقرارات",
                    "منع المستخدمين من معرفة النتائج",
                    "حذف جميع بيانات النظام",
                    "زيادة عدد مستخدمي الذكاء الاصطناعي"
                ],
                correct: 0
            },
            {
                q: "ما المقصود بالذكاء الاصطناعي القابل للتفسير (XAI)؟",
                options: [
                    "نظام يستخدم لتصميم الألعاب",
                    "نظام يخزن المعلومات فقط",
                    "ذكاء اصطناعي يساعد البشر على فهم منطق النظام وأسباب قراراته",
                    "برنامج يمنع الاتصال بالإنترنت"
                ],
                correct: 2
            },
            {
                q: "أي موقف يعبّر عن تطبيق مبدأ الشفافية في المدرسة؟",
                options: [
                    "تسجيل الحضور دون إخبار الطلاب",
                    "الاحتفاظ بالبيانات إلى الأبد",
                    "عدم توضيح أسباب رفض طلب الطالب",
                    "شرح كيفية استخدام نظام التعرف على الوجوه للطلاب وأولياء الأمور"
                ],
                correct: 3
            },
            {
                q: "ما الهدف من مبدأ حماية الخصوصية (Privacy Protection)؟",
                options: [
                    "التعامل مع المعلومات الشخصية بشكل آمن ومسؤول",
                    "نشر بيانات المستخدمين للجميع",
                    "زيادة عدد الصور المخزنة",
                    "مشاركة كلمات المرور مع الآخرين"
                ],
                correct: 0
            },
            {
                q: "أي مما يلي يُعد مثالًا على المعلومات الشخصية التي يجب حمايتها؟",
                options: [
                    "لون السماء",
                    "الموقع الجغرافي والبريد الإلكتروني",
                    "عدد أيام الأسبوع",
                    "درجة حرارة الغرفة"
                ],
                correct: 1
            },
            {
                q: "ما المقصود بمبدأ المساءلة (Accountability)؟",
                options: [
                    "إخفاء المسؤول عن أخطاء النظام",
                    "السماح للنظام باتخاذ جميع القرارات دون مراجعة",
                    "تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكانية محاسبتها",
                    "منع استخدام الذكاء الاصطناعي في المدارس"
                ],
                correct: 2
            },
            {
                q: "إذا أخطأ نظام التعرف على وجوه الطلاب في تسجيل الحضور، فما المبدأ الذي يساعد في تحديد المسؤول عن معالجة الخطأ؟",
                options: [
                    "العدالة فقط",
                    "الشفافية فقط",
                    "حماية الخصوصية فقط",
                    "المساءلة"
                ],
                correct: 3
            },
            {
                q: "ما الفائدة المحتملة من استخدام الذكاء الاصطناعي للتعرف على وجوه الطلاب؟",
                options: [
                    "تسهيل تسجيل الحضور وتوفير الوقت",
                    "إلغاء الحاجة إلى حماية البيانات",
                    "منع الطلاب من دخول المدرسة",
                    "إخفاء سجلات الحضور"
                ],
                correct: 0
            },
            {
                q: "إذا كان نظام الذكاء الاصطناعي يخطئ في التعرف على بعض الطلاب أكثر من غيرهم، فما المشكلة الأخلاقية المحتملة؟",
                options: [
                    "ضعف الاتصال بالإنترنت",
                    "التحيز وعدم تحقيق العدالة",
                    "زيادة مساحة التخزين",
                    "بطء الكتابة على لوحة المفاتيح"
                ],
                correct: 1
            },
            {
                q: "ما التصرف الأكثر مسؤولية عند استخدام نظام ذكاء اصطناعي في المدرسة؟",
                options: [
                    "الاعتماد على جميع قرارات النظام دون مراجعة",
                    "تجاهل أخطاء النظام",
                    "مراجعة النتائج والتأكد من العدالة والشفافية وحماية الخصوصية والمساءلة",
                    "مشاركة بيانات الطلاب مع أي جهة"
                ],
                correct: 2
            }
        ];

        let activeQuestions = [];
        let currentIdx = 0;
        let currentScore = 0;

        const qText = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options-container');
        const qCurrent = document.getElementById('q-current');
        const scoreLive = document.getElementById('score-live');
        const stars = document.getElementById('stars');
        const quizBox = document.getElementById('quiz-box');
        const resultBox = document.getElementById('result-box');
        const scoreFinal = document.getElementById('score-final');
        const feedbackMsg = document.getElementById('feedback-msg');

        // دالة لاختيار 5 أسئلة عشوائية فريدة من نوعها في كل دورة
        function prepareRandomQuestions() {
            // خلط مصفوفة الأسئلة الأصلية بشكل عشوائي كامل
            const shuffled = [...allQuestionsPool].sort(() => 0.5 - Math.random());
            // قطع أول 5 أسئلة فقط للاختبار الحالي
            activeQuestions = shuffled.slice(0, 5);
        }

        function renderQuestion() {
            const item = activeQuestions[currentIdx];
            qText.innerText = `${currentIdx + 1}. ${item.q}`;
            qCurrent.innerText = currentIdx + 1;
            scoreLive.innerText = currentScore;
            optionsContainer.innerHTML = '';

            item.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = opt;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }
        function selectOption(selectedIndex, btnElement) {
            const correctIndex = activeQuestions[currentIdx].correct;
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);
            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                currentScore++;
                scoreLive.innerText = currentScore;
                stars.classList.add('animate-stars');
                setTimeout(() => stars.classList.remove('animate-stars'), 800);
            } else {
                btnElement.classList.add('wrong');
                allBtns[correctIndex].classList.add('correct');
            }
            setTimeout(() => {
                currentIdx++;
                if (currentIdx < activeQuestions.length) {
                    renderQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }
        function showResults() {
            quizBox.style.display = 'none';
            resultBox.style.display = 'block';
            scoreFinal.innerText = currentScore;
            if (currentScore === 5) {
                feedbackMsg.innerText = "👑 سكور ممتاز وعلامة كاملة! 👑\nلقد أتقنتِ الإجابة على جميع الأسئلة الموجهة لكِ، مستوى مبهر!";
            } else if (currentScore >= 3) {
                feedbackMsg.innerText = "🌟 نتيجة رائعة! 🌟\nمستواكِ مستقر وقوي جداً. جربي اللعب مرة أخرى لتجربة أسئلة جديدة وتثبيت الإتقان.";
            } else {
                feedbackMsg.innerText = "📚 فرصة ممتازة للمحاولة مجدداً 📚\nالأسئلة العشوائية تقيس دقة الفهم الشامل، اضغطي على زر التحدي الجديد لتجربة مجموعة أسئلة أخرى وتحسين درجاتكِ!";
            }
        }
        function restartQuiz() {
            currentIdx = 0;
            currentScore = 0;
            resultBox.style.display = 'none';
            quizBox.style.display = 'block';
            prepareRandomQuestions();
            renderQuestion();
        }
        // بدء تشغيل اللعبة وتوليد الأسئلة العشوائية فور التحميل لأول مرة
        window.onload = function () {
            prepareRandomQuestions();
            renderQuestion();
        };
    </script>
